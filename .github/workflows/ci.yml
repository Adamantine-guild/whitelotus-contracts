name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install foundry-rs/forge-std --no-git

      - name: Build
        run: forge build

      - name: Format check
        run: forge fmt --check

      - name: Test
        run: forge test -vv
