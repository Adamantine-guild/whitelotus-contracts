name: Certora Formal Verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Certora CLI
        run: pip install certora-cli

      - name: Install solc
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux -O /usr/local/bin/solc
          chmod +x /usr/local/bin/solc

      - name: Run Certora Prover on Vault (Staking)
        run: certoraRun certora/conf/Vault.conf
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
