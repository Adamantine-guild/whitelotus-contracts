[profile.default]
src = "contracts"
test = "test/foundry"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
goerli = { key = "${ETHERSCAN_API_KEY}", url = "https://api-goerli.etherscan.io/api" }

[rpc_endpoints]
sepolia = "${RPC_URL}"
goerli = "${RPC_URL}"
